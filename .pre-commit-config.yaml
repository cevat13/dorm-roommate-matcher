repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ruff and mypy both run from the project environment rather than isolated
  # ones. A pinned hook version drifts from the version in pyproject.toml, and
  # this package also depends on fastapi, typer and pytest, which an isolated
  # hook cannot see. Running them locally keeps one version in play everywhere.
  #
  # --force-exclude is required because pre-commit passes explicit filenames,
  # and without it ruff ignores the exclusions in pyproject.toml.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: ruff check --fix --force-exclude
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: ruff format --force-exclude
        language: system
        types: [python]
        require_serial: true

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
